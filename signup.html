<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up | The Crochet Aura</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header"><div class="container nav">
<a class="brand" href="index.html"><img src="assets/logo.png">The Crochet Aura</a>
<a href="shop.html">Shop</a>
</div></header>
<section class="page-hero"><h1 class="page-title">Join Our Family ♡</h1><p>Create your personal account.</p></section>
<main class="container content" style="max-width:540px">
<form class="panel" id="signupForm">
<div class="field"><label>Full Name</label><input id="name" required></div>
<div class="field"><label>Email</label><input id="email" type="email" required></div>
<div class="field"><label>Phone Number</label><input id="phone" type="tel"></div>
<div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div>
<button type="submit">Create Account</button>
<p>Already registered? <a href="login.html">Login</a></p>
</form></main>
<script src="app.js"></script>
</body></html>
